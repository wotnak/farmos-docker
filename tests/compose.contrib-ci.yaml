services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: farm_test
      POSTGRES_USER: farm_test
      POSTGRES_PASSWORD: farm_test
    healthcheck:
      test: [CMD-SHELL, pg_isready -U farm_test -d farm_test]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - database:/var/lib/postgresql/data
  ci:
    image: ${IMAGE:-ghcr.io/wotnak/farmos:4-dev}
    pull_policy: never
    user: '0:0'
    depends_on:
      db:
        condition: service_healthy
    environment:
      XDEBUG_MODE: 'off'
      COMPOSER_ALLOW_SUPERUSER: '1'
      SIMPLETEST_DB: pgsql://farm_test:farm_test@db/farm_test
      SIMPLETEST_BASE_URL: http://127.0.0.1:8080
      BROWSERTEST_OUTPUT_DIRECTORY: /artifacts/positive/browser-output
    volumes:
      - ./fixtures/contrib-ci/farm_ci_example:/checkout:ro
      - ${TEST_ARTIFACTS:?runner sets TEST_ARTIFACTS}:/artifacts
    healthcheck:
      test: [CMD, /bin/wget, -q, -O, -, 'http://127.0.0.1:8080/healthz']
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  database:
