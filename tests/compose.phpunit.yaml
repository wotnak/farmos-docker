services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: farm_test
      POSTGRES_USER: farm_test
      POSTGRES_PASSWORD: farm_test
    healthcheck:
      test: [CMD-SHELL, pg_isready -U farm_test -d farm_test]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - database:/var/lib/postgresql/data

  chrome:
    # Chromium supports both architectures built by this project.
    image: ${SELENIUM_IMAGE:-selenium/standalone-chromium:4.35.0-20250828@sha256:f824da40851c285a547cffe88e87ec4b0e7fdc996a25f678bbb03ee76d7a7467}
    shm_size: 2gb
    environment:
      SE_NODE_MAX_SESSIONS: 1
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent http://localhost:4444/status | grep -q ''"ready": true''']
      interval: 2s
      timeout: 5s
      retries: 60

  farmos:
    image: ${IMAGE:-ghcr.io/wotnak/farmos:4-dev}
    pull_policy: never
    depends_on:
      db:
        condition: service_healthy
      chrome:
        condition: service_healthy
    environment:
      XDEBUG_MODE: 'off'
      SIMPLETEST_BASE_URL: http://farmos:8080
      SIMPLETEST_DB: pgsql://farm_test:farm_test@db/farm_test
      MINK_DRIVER_ARGS_WEBDRIVER: '["chrome", {"goog:chromeOptions": {"w3c": true, "args": ["--headless", "--no-sandbox", "--disable-dev-shm-usage"]}}, "http://chrome:4444/wd/hub"]'
      BROWSERTEST_OUTPUT_DIRECTORY: /tmp/phpunit/browser-output
    volumes:
      - sites:/opt/farmos/web/sites
      - private_files:/opt/farmos/private_files
    healthcheck:
      test: [CMD, /bin/wget, -q, -O, -, 'http://127.0.0.1:8080/healthz']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  database:
  sites:
  private_files:
