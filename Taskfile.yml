version: '3'
dotenv: ['.env']
includes:
  integration:
    taskfile: ./tasks/integration.yml
    internal: true
vars:
  CONFIGURATION: '{{.CONFIGURATION | default ""}}'
  VARIANT: '{{.VARIANT | default ""}}'
  PREPARED: '{{.PREPARED | default "false"}}'
  LOADED: '{{.LOADED | default "false"}}'
  HTTPS: '{{.HTTPS | default "false"}}'
  ACTION: '{{.ACTION | default "info"}}'
  LOCAL: >-
    python3 {{printf "%s/scripts/local_build.py" .ROOT_DIR | shellQuote}}
    --root {{.ROOT_DIR | shellQuote}}
    {{if .CONFIGURATION}}--configuration {{.CONFIGURATION | shellQuote}}{{end}}
  VARIANT_ARG: '{{if .VARIANT}}--variant {{.VARIANT | shellQuote}}{{end}}'
tasks:
  prepare-inputs:
    desc: Resolve fresh dependencies for the configured build profile
    run: once
    cmds:
    - '{{.LOCAL}} prepare'
  _prepare:
    internal: true
    status:
    - test {{.SKIP | shellQuote}} = true
    cmds:
    - task: prepare-inputs
  build:
    desc: Build selected variants (VARIANT optional; PREPARED=true reuses inputs)
    cmds:
    - task: _prepare
      vars:
        SKIP: '{{.PREPARED}}'
    - '{{.LOCAL}} --prepared {{.VARIANT_ARG}} build'
  load:
    desc: Build and load selected variants (VARIANT optional; PREPARED=true reuses inputs)
    cmds:
    - task: _prepare
      vars:
        SKIP: '{{.PREPARED}}'
    - '{{.LOCAL}} --prepared {{.VARIANT_ARG}} load'
  push:
    desc: Build, load and push selected variants (VARIANT optional; PREPARED=true reuses inputs)
    cmds:
    - task: _prepare
      vars:
        SKIP: '{{.PREPARED}}'
    - '{{.LOCAL}} --prepared {{.VARIANT_ARG}} push'
  test:
    desc: Test variants (VARIANT/SUITE optional; LOADED=true skips builds; PREPARED=true reuses inputs)
    cmds:
    - task: _prepare
      vars:
        SKIP: '{{if eq .LOADED "true"}}true{{else}}{{.PREPARED}}{{end}}'
    - >-
      {{.LOCAL}} --prepared {{.VARIANT_ARG}}
      {{if eq .LOADED "true"}}--loaded{{end}}
      {{if .SUITE}}--suite {{.SUITE | shellQuote}}{{end}} test {{.CLI_ARGS}}
  test-stack:
    desc: Run a suite in the shared disposable Compose stack (SUITE required)
    requires:
      vars: [SUITE]
    cmds:
    - task: integration:run
      vars:
        SUITE: '{{.SUITE}}'
  run:
    desc: Build and start production (HTTPS=true enables public HTTPS; PREPARED=true reuses inputs)
    cmds:
    - task: _prepare
      vars:
        SKIP: '{{.PREPARED}}'
    - '{{.LOCAL}} --prepared {{if eq .HTTPS "true"}}--https{{end}} run'
  clean:
    desc: Remove generated build outputs and test reports
    cmds:
    - if [ -d build ]; then find build -mindepth 1 -delete; fi
  cache:
    desc: Inspect or prune the existing Docker Nix build cache (ACTION=info|prune)
    cmds:
    - |
      case {{.ACTION | shellQuote}} in
        info) bash scripts/nix-build-cache info ;;
        prune) {{.LOCAL}} --prepared cache-prune ;;
        *) echo 'ACTION must be info or prune' >&2; exit 2 ;;
      esac
