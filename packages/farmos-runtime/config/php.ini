memory_limit = 256M
max_execution_time = 240
max_input_time = 240
max_input_vars = 5000
post_max_size = 100M
upload_max_filesize = 100M
; Finish Drupal's deferred route rebuilds before returning the response.
; Early responses can make the next request miss newly created quick forms.
disable_functions = fastcgi_finish_request
