name: Hourly image refresh

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: hourly-image-refresh
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  discover:
    name: Discover environments
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.environments.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Discover configured environments
        id: environments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          matrix=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/environments?per_page=100" |
            python3 scripts/build_environments.py discover)
          if [ "$(jq '.include | length' <<< "$matrix")" -eq 0 ]; then
            echo '::error::Configure a GitHub Environment with FARMOS_VERSION and FARMOS_IMAGE_TAG before building images.'
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  refresh:
    name: Build ${{ matrix.environment }}
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      actions: read
    uses: ./.github/workflows/build-images.yaml
    secrets: inherit
    with:
      environment: ${{ matrix.environment }}
      publish: true
