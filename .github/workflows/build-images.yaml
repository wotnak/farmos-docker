name: Build images

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Build environment
        type: environment
        required: true
      publish:
        description: Publish each variant after its builds and tests pass
        type: boolean
        required: false
        default: true
  workflow_call:
    inputs:
      environment:
        description: Build environment
        type: string
        required: true
      publish:
        description: Publish each variant after its builds and tests pass
        type: boolean
        required: false
        default: true

concurrency:
  group: build-images-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  prepare:
    name: 'Prepare: ${{ inputs.environment }}'
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    outputs:
      environment-id: ${{ steps.configuration.outputs.environment-id }}
      artifact: ${{ steps.configuration.outputs.artifact }}
      matrix: ${{ steps.plan.outputs.matrix }}
      image-name: ${{ steps.plan.outputs.image-name }}
      registry: ${{ steps.plan.outputs.registry }}
    steps:
      - uses: actions/checkout@v7
      - name: Read and validate build profile
        id: configuration
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ENVIRONMENT: ${{ inputs.environment }}
          FARMOS_VERSION: ${{ vars.FARMOS_VERSION }}
          FARMOS_IMAGE_NAME: ${{ vars.FARMOS_IMAGE_NAME }}
          FARMOS_IMAGE_TAG: ${{ vars.FARMOS_IMAGE_TAG }}
          FARMOS_REPOSITORY: ${{ vars.FARMOS_REPOSITORY }}
          FARMOS_IMAGE_VARIANTS: ${{ vars.FARMOS_IMAGE_VARIANTS }}
        run: |
          encoded=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["BUILD_ENVIRONMENT"], safe=""))')
          identifier=$(gh api "repos/$GITHUB_REPOSITORY/environments/$encoded" --jq '.id')
          python3 scripts/build_environments.py select > "$RUNNER_TEMP/configuration.json"
          echo "environment-id=$identifier" >> "$GITHUB_OUTPUT"
          echo "artifact=build-inputs-env-$identifier" >> "$GITHUB_OUTPUT"
      - uses: cachix/install-nix-action@v31
      - uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - name: Resolve fresh build dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          NIX_SYSTEM: x86_64-linux
        run: task prepare-inputs CONFIGURATION="$RUNNER_TEMP/configuration.json"
      - name: Select image builds
        id: plan
        shell: bash
        run: |
          configuration=.build-inputs/build.json
          matrix=$(python3 scripts/build_environments.py variant-matrix --configuration "$configuration" | jq -c .)
          image_name=$(jq -r '."image-name"' "$configuration")
          first=${image_name%%/*}
          case "$image_name" in
            */*)
              case "$first" in
                *.*|*:*|localhost) registry=$first ;;
                *) registry=docker.io ;;
              esac ;;
            *) registry=docker.io ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "image-name=$image_name" >> "$GITHUB_OUTPUT"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
      - name: Share resolved build inputs
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.configuration.outputs.artifact }}
          path: |
            .build-inputs/
            flake.lock
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  variant:
    name: 'Variant: ${{ inputs.environment }} · ${{ matrix.variant }}'
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/build-variant.yaml
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      environment-id: ${{ needs.prepare.outputs.environment-id }}
      artifact: ${{ needs.prepare.outputs.artifact }}
      image-name: ${{ needs.prepare.outputs.image-name }}
      registry: ${{ needs.prepare.outputs.registry }}
      variant: ${{ matrix.variant }}
      output: ${{ matrix.output }}
      suite: ${{ matrix.suite }}
      publish: ${{ inputs.publish }}
