name: 4.x development image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Promote public tags after all builds and tests pass
        type: boolean
        required: false
        default: true
  workflow_call:
    inputs:
      publish:
        description: Promote public tags after all builds and tests pass
        type: boolean
        required: false
        default: true
      source-revision:
        description: Exact source revision to build
        type: string
        required: false
        default: ""
      build-inputs-artifact:
        description: Artifact containing .build-inputs and flake.lock for this publication
        type: string
        required: false
        default: ""

concurrency:
  group: publish-branch-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  actions: read

env:
  IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY || 'ghcr.io/wotnak/farmos' }}
  SIGNING_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/branch-image.yaml@${{ github.ref }}
  SOURCE_REVISION: ${{ inputs.source-revision || github.sha }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      artifact: ${{ inputs.build-inputs-artifact || 'build-inputs-branch' }}
    steps:
      - uses: actions/checkout@v7
        if: inputs.build-inputs-artifact == ''
        with:
          ref: ${{ inputs.source-revision || github.sha }}
      - uses: cachix/install-nix-action@v31
        if: inputs.build-inputs-artifact == ''
      - name: Resolve fresh build dependencies
        if: inputs.build-inputs-artifact == ''
        env:
          GH_TOKEN: ${{ github.token }}
          NIX_SYSTEM: x86_64-linux
        run: scripts/prepare-build --branch-only
      - name: Share resolved build inputs
        if: inputs.build-inputs-artifact == ''
        uses: actions/upload-artifact@v7
        with:
          name: build-inputs-branch
          path: |
            .build-inputs/
            flake.lock
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  build:
    name: Build 4.x-dev · ${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-revision || github.sha }}
      - name: Download resolved build inputs
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: .
      - name: Include generated inputs in the Nix source
        run: git add -f -- .build-inputs flake.lock
      - name: Record the image source identity
        run: |
          python3 scripts/image_evidence.py prepare-source
          git add -- images/source.json
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ matrix.system }}-farmos-4x-dev-${{ hashFiles('flake.nix', 'flake.lock', '.build-inputs/**', 'packages/**', 'images/**', 'versions.json', 'scripts/**', 'tests/check-runtime.php') }}
          restore-prefixes-first-match: nix-${{ matrix.system }}-farmos-4x-dev-
      - uses: ./.github/actions/setup-image-evidence
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and test image
        shell: bash
        run: |
          nix --extra-experimental-features "nix-command flakes" \
            run --system "${{ matrix.system }}" .#farmos-4x-dev.copyToDockerDaemon
          IMAGE=ghcr.io/wotnak/farmos:4.x-dev DEV=1 sh tests/smoke-test.sh
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - name: Run upstream farmOS PHPUnit tests
        timeout-minutes: 60
        env:
          IMAGE: ghcr.io/wotnak/farmos:4.x-dev
          TEST_ARTIFACTS: ${{ runner.temp }}/phpunit-tests
        run: task phpunit-test-loaded
      - name: Save upstream test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phpunit-tests-4x-dev-${{ matrix.arch }}
          path: ${{ runner.temp }}/phpunit-tests/
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
      - name: Push architecture candidate
        id: candidate
        shell: bash
        run: |
          repository="$IMAGE_REPOSITORY"
          output="farmos-4x-dev"
          evidence="$RUNNER_TEMP/image-evidence"
          mkdir -p "$evidence"
          nix --extra-experimental-features "nix-command flakes" \
            run --system "${{ matrix.system }}" ".#\"$output\".copyTo" -- \
            --format oci --digestfile "$evidence/digest.txt" \
            "docker://${repository}:4.x-dev-${{ matrix.arch }}-${GITHUB_RUN_ID}"
          image="${repository}@$(cat "$evidence/digest.txt")"
          python3 scripts/image_evidence.py architecture \
            --system "${{ matrix.system }}" --output "$output" \
            --image "$image" --destination "$evidence"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Sign the image and its provenance
        env:
          CANDIDATE_IMAGE: ${{ steps.candidate.outputs.image }}
        run: scripts/attest-image sign "$CANDIDATE_IMAGE" "$RUNNER_TEMP/image-evidence" architecture
      - name: Save architecture digests and evidence
        uses: actions/upload-artifact@v7
        with:
          name: image-evidence-4x-dev-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-evidence/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  manifest:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-revision || github.sha }}
      - name: Download resolved build inputs
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: .
      - name: Include generated inputs in the Nix source
        run: git add -f -- .build-inputs flake.lock
      - name: Record the image source identity
        run: |
          python3 scripts/image_evidence.py prepare-source
          git add -- images/source.json
      - uses: ./.github/actions/setup-image-evidence
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download architecture evidence
        uses: actions/download-artifact@v8
        with:
          pattern: image-evidence-4x-dev-*
          path: ${{ runner.temp }}/children
      - name: Verify evidence and publish signed candidate indexes
        shell: bash
        run: |
          scripts/publish-index farmos-4x-dev "$RUNNER_TEMP/children" \
            "$RUNNER_TEMP/index-evidence/4x-dev"
      - name: Save index evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: index-evidence-4x-dev
          path: ${{ runner.temp }}/index-evidence/
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

  promote:
    needs: [prepare, build, manifest]
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source-revision || github.sha }}
      - name: Download resolved build inputs
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: .
      - name: Include generated inputs in the Nix source
        run: git add -f -- .build-inputs flake.lock
      - name: Record source identity
        run: |
          python3 scripts/image_evidence.py prepare-source
          git add -- images/source.json
      - uses: ./.github/actions/setup-image-evidence
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          pattern: image-evidence-4x-dev*
          path: ${{ runner.temp }}/children
      - uses: actions/download-artifact@v8
        with:
          pattern: index-evidence-4x-dev*
          path: ${{ runner.temp }}/indexes
      - name: Verify the complete image set and promote public tags
        run: |
          python3 scripts/promote-images --branch-only \
            --indexes "$RUNNER_TEMP/indexes" --children "$RUNNER_TEMP/children" \
            --destination "$RUNNER_TEMP/promotion"
      - name: Save promotion report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: promotion-4x-dev
          path: ${{ runner.temp }}/promotion/
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
