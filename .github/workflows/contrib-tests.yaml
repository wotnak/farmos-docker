name: Contributed module acceptance tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/e2e/**'
      - 'tests/compose*.yaml'
      - 'packages/**'
      - 'images/**'
      - 'flake.*'
      - 'Taskfile.yml'
      - 'scripts/**'
      - '.github/workflows/contrib-tests.yaml'

permissions:
  contents: read

concurrency:
  group: contrib-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contrib:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FARMOS_VERSION: ^4.0
      FARMOS_IMAGE_TAG: contrib-ci
      FARMOS_IMAGE_VARIANTS: runtime,development-runtime
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-contrib-${{ hashFiles('flake.nix', 'packages/**', 'images/**', 'scripts/**') }}
          restore-prefixes-first-match: nix-contrib-
      - uses: go-task/setup-task@v2
        with:
          version: '3.53.1'
      - name: Install and test all seven modules, including both planning modules
        run: task test SUITE=contrib
      - name: Save reports, dependency lock and container logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contrib-tests
          path: |
            build/tests/contrib/run-*/
          if-no-files-found: warn
          retention-days: 14
