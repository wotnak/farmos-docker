name: Contributed module acceptance tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/e2e/**'
      - 'tests/compose*.yaml'
      - 'packages/**'
      - 'images/**'
      - 'versions.json'
      - 'flake.*'
      - 'Taskfile.yml'
      - 'scripts/**'
      - '.github/workflows/contrib-tests.yaml'

permissions:
  contents: read

concurrency:
  group: contrib-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contrib:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-contrib-${{ hashFiles('flake.nix', 'packages/**', 'images/**', 'versions.json', 'scripts/**') }}
          restore-prefixes-first-match: nix-contrib-
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: '3.53.1'
      - name: Install and test all seven modules, including both planning modules
        run: task contrib-test
      - name: Save reports, dependency lock and container logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contrib-tests
          path: |
            build/tests/contrib/run-*/
          if-no-files-found: warn
          retention-days: 14
